# conda 环境复现：
#     conda env create -f environment.yml
#     conda activate alpholio
#     pip install -e .
#
# 这组版本在 Python 3.12.2 下验证通过，是本包已确认可用的确切组合。
# 包本身的兼容区间更宽松，见 pyproject.toml 的 [project].dependencies，
# 其下限由 CI 在 3.10 / 3.11 / 3.12 / 3.13 四个版本上验证。
name: alpholio
channels:
  - conda-forge
dependencies:
  - python=3.12.2

  # 运行时
  - numpy=1.26.4
  - pandas=2.2.2
  - pyarrow=23.0.1
  - matplotlib-base=3.9.2

  # 构建
  - setuptools=75.2.0

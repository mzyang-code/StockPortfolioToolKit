# conda 环境复现：
#     conda env create -f environment.yml
#     conda activate alpholio
#     pip install -e .
#
# 这组版本在 Python 3.12.2 下跑通全部测试：142 个只依赖合成夹具，另 6 个需要
# tests/cache/ 下的月频面板，该面板不随仓库分发，缺失时跳过。
# 包本身的兼容区间更宽松，见 pyproject.toml 的 [project].dependencies。
name: alpholio
channels:
  - conda-forge
dependencies:
  - python=3.12.2

  # 运行时
  - numpy=1.26.4
  - pandas=2.2.2
  - pyarrow=23.0.1
  - matplotlib-base=3.9.2

  # 开发/测试
  - pytest=9.1.1
  - setuptools=75.2.0

  # 跑 quickstart_*.ipynb 用；纯用包不需要
  - jupyter_core=5.7.2
  - nbclient=0.10.4
  - nbformat=5.10.4
  - ipykernel=6.29.5
